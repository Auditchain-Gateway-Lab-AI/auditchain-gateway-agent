version: "3.9"

# Isolated read-only audit-module trial. This service does not replace the
# existing Agent container and binds only to loopback unless explicitly changed.
services:
  auditchain-agent-audit-poc:
    build:
      context: .
      dockerfile: Dockerfile
    image: auditchain-agent:latest
    container_name: auditchain-agent-audit-poc
    restart: "no"
    environment:
      DB_HOST: ${DB_HOST:?set DB_HOST in .env}
      DB_PORT: ${DB_PORT:-1521}
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-ORCLCDB}
      AGENT_VERIFY_TOKEN: ${AGENT_VERIFY_TOKEN:?set AGENT_VERIFY_TOKEN in .env}
      AGENT_VERIFY_PORT: "9091"
      AGENT_ENABLE_TABLE_ENDPOINT: "false"
      AGENT_RECOVERY_ENABLED: "false"
      AGENT_AUDIT_MODULE_ENABLED: "true"
      AGENT_AUDIT_CLIENT_ID: ${AGENT_AUDIT_CLIENT_ID:?set AGENT_AUDIT_CLIENT_ID in .env}
      GATEWAY_URL: ${GATEWAY_URL:?set GATEWAY_URL in .env}
      AUDITCHAIN_API_KEY: ${AUDITCHAIN_API_KEY:?set AUDITCHAIN_API_KEY in .env}
    ports:
      - "${AGENT_AUDIT_POC_BIND_IP:-127.0.0.1}:9091:9091"
    volumes:
      - ./config.yml:/app/config.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9091/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
