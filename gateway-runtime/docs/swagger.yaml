info:
  contact:
    email: support@auditchain.local
    name: API Support
  description: API Enterprise untuk sistem audit log berbasis Blockchain dan Merkle
    Tree.
  termsOfService: http://swagger.io/terms/
  title: AuditChain Gateway API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Autentikasi pengguna dan mendapatkan token JWT untuk akses API.
      parameters:
      - description: Kredensial Login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.AuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login berhasil dan mengembalikan token
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Format request tidak valid
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Username atau Password salah!
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Akun dinonaktifkan karena client tidak aktif
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Gagal mencetak token keamanan
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: User login
      tags:
      - Auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Mendapatkan informasi profil dari pengguna yang sedang login (berdasarkan
        JWT).
      produces:
      - application/json
      responses:
        "200":
          description: Data profil user
          schema:
            $ref: '#/definitions/auth.ProfileResponseData'
        "401":
          description: Token tidak memiliki identitas user yang valid
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: Profil user tidak ditemukan
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - Auth
    put:
      consumes:
      - application/json
      description: Memperbarui informasi profil pengguna yang sedang login. Bisa juga
        untuk mengubah password.
      parameters:
      - description: Data Profil Baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ProfileUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Profil berhasil diperbarui dan mengembalikan token baru jika
            password diubah
          schema:
            $ref: '#/definitions/auth.UpdateProfileResponse'
        "400":
          description: Validasi input gagal (misal username terlalu pendek)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Token tidak valid atau Password saat ini tidak sesuai
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "409":
          description: Username sudah digunakan
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Gagal memperbarui profil
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Mendaftarkan pengguna baru (auditor/admin) ke dalam perusahaan
        (client) tertentu.
      parameters:
      - description: Data Pendaftaran
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Pengguna berhasil didaftarkan
          schema:
            $ref: '#/definitions/auth.RegisterResponse'
        "400":
          description: Format tidak valid atau client_id belum diisi
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: Perusahaan (Client ID) tidak terdaftar di sistem
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "409":
          description: Username sudah digunakan
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Gagal memproses pendaftaran
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Register a new user
      tags:
      - Auth
  /client:
    get:
      description: Mengambil daftar semua klien/perusahaan yang terdaftar.
      produces:
      - application/json
      responses:
        "200":
          description: Daftar klien
          schema:
            items:
              $ref: '#/definitions/models.Client'
            type: array
        "500":
          description: Gagal mengambil daftar klien
          schema:
            $ref: '#/definitions/client.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all clients
      tags:
      - Client
    post:
      consumes:
      - application/json
      description: Mendaftarkan klien/perusahaan baru dan mengembalikan API Key.
      parameters:
      - description: Data Klien
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/client.CreateClientRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Klien berhasil didaftarkan
          schema:
            $ref: '#/definitions/client.CreateClientResponse'
        "400":
          description: Format tidak valid
          schema:
            $ref: '#/definitions/client.ErrorResponse'
        "500":
          description: Gagal mendaftarkan klien
          schema:
            $ref: '#/definitions/client.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new client (SaaS tenant)
      tags:
      - Client
  /client/{id}:
    get:
      description: Mengambil detail informasi klien beserta konfigurasi agent dan
        kafka-nya.
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Detail klien
          schema:
            $ref: '#/definitions/client.ClientDetailResponse'
        "400":
          description: ID klien kosong
          schema:
            $ref: '#/definitions/client.ErrorResponse'
        "404":
          description: Klien tidak ditemukan
          schema:
            $ref: '#/definitions/client.ErrorResponse'
        "500":
          description: Gagal mengambil data klien
          schema:
            $ref: '#/definitions/client.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get client detail
      tags:
      - Client
  /dashboard/inventory:
    get:
      description: Mengambil inventaris/daftar resource unik (tabel/entity) yang terekam.
      produces:
      - application/json
      responses:
        "200":
          description: Daftar resource inventory
          schema:
            items:
              $ref: '#/definitions/models.ClientTable'
            type: array
        "401":
          description: Identitas client tidak valid
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "500":
          description: Gagal memuat daftar data
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get resource inventory
      tags:
      - Audit
  /dashboard/logs:
    get:
      description: Mengambil daftar log terbaru dengan dukungan paginasi dan filter.
      parameters:
      - description: 'Nomor Halaman (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Ukuran Halaman (default: 10, maksimum: 100)'
        in: query
        name: page_size
        type: integer
      - description: Filter Status Integritas (valid, tampered, unreachable)
        in: query
        name: integrity_status
        type: string
      - description: Urutan (asc, desc)
        in: query
        name: sort_order
        type: string
      - description: Filter Tabel Sumber
        in: query
        name: source_table
        type: string
      - description: Filter Database Engine
        in: query
        name: db_engine
        type: string
      - description: Waktu Mulai (RFC3339)
        in: query
        name: from
        type: string
      - description: Waktu Selesai (RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Daftar log beserta data paginasi
          schema:
            $ref: '#/definitions/audit.RecentLogsResponse'
        "400":
          description: Parameter tidak valid
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "401":
          description: Identitas client tidak valid
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "500":
          description: Gagal mengambil log terbaru
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get recent audit logs
      tags:
      - Audit
  /dashboard/stats:
    get:
      description: Mengambil statistik agregat tenant client yang sedang login. Parameter
        trend_range opsional menambahkan bucket agregat dari audit_logs tanpa mengirim
        row log.
      parameters:
      - description: Rentang trend agregat
        enum:
        - 8H
        - 24H
        - 7D
        - 30D
        in: query
        name: trend_range
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Statistik dashboard client
          schema:
            $ref: '#/definitions/client.DashboardStatsResponse'
        "400":
          description: Rentang trend tidak didukung
          schema:
            $ref: '#/definitions/client.ErrorResponse'
        "401":
          description: Client ID tidak ditemukan atau tidak valid pada token
          schema:
            $ref: '#/definitions/client.ErrorResponse'
        "500":
          description: Gagal mengambil statistik dashboard
          schema:
            $ref: '#/definitions/client.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get client dashboard statistics
      tags:
      - Dashboard
  /dashboard/verification-runs:
    post:
      consumes:
      - application/json
      description: Membuat job verifikasi range yang diproses backend secara bertahap.
        Ukuran batch membatasi pekerjaan per iterasi, bukan total log dalam range.
      parameters:
      - description: Rentang verifikasi dan ukuran batch
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/audit.CreateVerificationRunRequest'
      - description: Client ID; hanya admin yang boleh memilih tenant
        in: query
        name: client_id
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Job berhasil diantrikan
          schema:
            $ref: '#/definitions/audit.VerificationRunResponseEnvelope'
        "400":
          description: Rentang tidak valid
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "401":
          description: Identitas client tidak valid
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "503":
          description: Background verifier belum tersedia
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Queue a background verification run
      tags:
      - Audit
  /dashboard/verification-runs/{id}:
    get:
      description: Mengambil progress dan summary verification run yang hanya boleh
        diakses oleh tenant pada token.
      parameters:
      - description: Verification run ID
        in: path
        name: id
        required: true
        type: string
      - description: Client ID; hanya admin yang boleh memilih tenant
        in: query
        name: client_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Progress verification run
          schema:
            $ref: '#/definitions/audit.VerificationRunResponseEnvelope'
        "401":
          description: Identitas client tidak valid
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "404":
          description: Verification run tidak ditemukan
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a background verification run
      tags:
      - Audit
  /dashboard/verification-runs/latest:
    get:
      description: Mengambil verification run terakhir untuk tenant yang sedang login.
        Jika belum ada run, data bernilai null.
      parameters:
      - description: Client ID; hanya admin yang boleh memilih tenant
        in: query
        name: client_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Verification run terakhir
          schema:
            $ref: '#/definitions/audit.LatestVerificationRunResponse'
        "401":
          description: Identitas client tidak valid
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get the latest background verification run
      tags:
      - Audit
  /dashboard/verify-range:
    get:
      description: Compatibility alias for the gateway dashboard. New clients should
        use /dashboard/verify-range/internal.
      parameters:
      - description: Waktu mulai (RFC3339)
        in: query
        name: from
        required: true
        type: string
      - description: Waktu selesai (RFC3339)
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Ringkasan dan hasil tiap log
          schema:
            $ref: '#/definitions/audit.RangeVerificationResult'
        "400":
          description: Parameter rentang tidak valid
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "401":
          description: Identitas client tidak valid
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "422":
          description: Range terlalu besar untuk verifikasi sinkron
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "500":
          description: Gagal memverifikasi range log
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Verify all logs in a time range (legacy route)
      tags:
      - Audit
  /dashboard/verify-range/client:
    get:
      description: Memverifikasi seluruh audit log dalam rentang waktu dengan kontrak
        yang sama seperti gateway dashboard. Client Portal hanya menerima summary
        tanpa daftar row log.
      parameters:
      - description: Waktu mulai (RFC3339)
        in: query
        name: from
        required: true
        type: string
      - description: Waktu selesai (RFC3339)
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Summary verifikasi log client
          schema:
            $ref: '#/definitions/audit.ClientRangeVerificationResponse'
        "400":
          description: Parameter rentang tidak valid
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "401":
          description: Identitas client tidak valid
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "422":
          description: Range terlalu besar untuk verifikasi sinkron
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "500":
          description: Gagal memverifikasi client range log
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Verify client logs in a time range
      tags:
      - Audit
  /dashboard/verify-range/estimate:
    get:
      description: Menghitung jumlah audit log dalam rentang waktu sebelum verifikasi
        sinkron dijalankan.
      parameters:
      - description: Waktu mulai (RFC3339)
        in: query
        name: from
        required: true
        type: string
      - description: Waktu selesai (RFC3339)
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Estimasi ukuran range
          schema:
            $ref: '#/definitions/audit.VerifyRangeEstimateResponse'
        "400":
          description: Parameter rentang tidak valid
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "401":
          description: Identitas client tidak valid
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "500":
          description: Gagal menghitung estimasi range
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Estimate verification range
      tags:
      - Audit
  /dashboard/verify-range/internal:
    get:
      description: Memverifikasi seluruh audit log dalam rentang waktu secara sinkron.
      parameters:
      - description: Waktu mulai (RFC3339)
        in: query
        name: from
        required: true
        type: string
      - description: Waktu selesai (RFC3339)
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Ringkasan dan hasil tiap log
          schema:
            $ref: '#/definitions/audit.RangeVerificationResult'
        "400":
          description: Parameter rentang tidak valid
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "401":
          description: Identitas client tidak valid
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "422":
          description: Range terlalu besar untuk verifikasi sinkron
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "500":
          description: Gagal memverifikasi range log
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Verify all logs in a time range
      tags:
      - Audit
  /dashboard/verify/{log_id}:
    get:
      description: Memverifikasi integritas satu log tertentu (Lapis 2, 3, dan 4).
      parameters:
      - description: ID Log
        in: path
        name: log_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Verifikasi sukses dan log valid
          schema:
            $ref: '#/definitions/audit.VerifyLogResponse'
        "202":
          description: Verifikasi pending/dalam proses
          schema:
            $ref: '#/definitions/audit.VerifyLogResponse'
        "401":
          description: Identitas client tidak valid
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "404":
          description: Log tidak ditemukan
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "409":
          description: Verifikasi gagal/tampered pada suatu layer
          schema:
            $ref: '#/definitions/audit.VerifyLogResponse'
        "500":
          description: Kesalahan sistem saat verifikasi
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Verify a specific log
      tags:
      - Audit
  /recovery/incidents/{id}:
    get:
      description: Mengambil detail sebuah insiden tamper berdasarkan ID.
      parameters:
      - description: Incident ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Detail Insiden Tamper
          schema:
            $ref: '#/definitions/recovery.IncidentDetailResponse'
        "401":
          description: Identitas client tidak valid
          schema:
            $ref: '#/definitions/recovery.ErrorResponse'
        "404":
          description: Tamper incident tidak ditemukan
          schema:
            $ref: '#/definitions/recovery.ErrorResponse'
        "500":
          description: Gagal mengambil detail tamper incident
          schema:
            $ref: '#/definitions/recovery.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get tamper incident detail
      tags:
      - Recovery
  /recovery/incidents/{id}/candidates:
    get:
      description: Mengambil referensi event client yang valid terhadap Merkle proof
        dan Fabric untuk insiden tertentu.
      parameters:
      - description: Incident ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Daftar kandidat recovery
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Identitas client tidak valid
          schema:
            $ref: '#/definitions/recovery.ErrorResponse'
        "404":
          description: Insiden tidak ditemukan
          schema:
            $ref: '#/definitions/recovery.ErrorResponse'
        "500":
          description: Gagal mengambil daftar kandidat
          schema:
            $ref: '#/definitions/recovery.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List trusted client recovery references
      tags:
      - Recovery
  /recovery/incidents/{id}/preflight:
    post:
      description: Memeriksa referensi PostgreSQL/Fabric dan state live Agent sebelum
        recovery tanpa melakukan write.
      parameters:
      - description: Incident ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Hasil preflight check
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Identitas client tidak valid
          schema:
            $ref: '#/definitions/recovery.ErrorResponse'
        "409":
          description: Konflik atau kondisi tidak valid untuk preflight
          schema:
            $ref: '#/definitions/recovery.ErrorResponse'
        "500":
          description: Gagal melakukan preflight
          schema:
            $ref: '#/definitions/recovery.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Preflight check for recovery
      tags:
      - Recovery
  /recovery/requests:
    get:
      description: Mengambil daftar permintaan (request) recovery yang diajukan.
      parameters:
      - description: Filter Status Request
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Daftar recovery request
          schema:
            $ref: '#/definitions/recovery.RequestListResponse'
        "401":
          description: Identitas client tidak valid
          schema:
            $ref: '#/definitions/recovery.ErrorResponse'
        "500":
          description: Gagal mengambil daftar recovery request
          schema:
            $ref: '#/definitions/recovery.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List recovery requests
      tags:
      - Recovery
    post:
      consumes:
      - application/json
      description: Membekukan intent recovery state client melalui Agent setelah preflight
        Fabric dan state live lulus.
      parameters:
      - description: Data Request Recovery
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/recovery.CreateRequestInput'
      produces:
      - application/json
      responses:
        "201":
          description: Recovery request berhasil dibuat
          schema:
            $ref: '#/definitions/recovery.RequestDetailResponse'
        "400":
          description: Format request tidak valid
          schema:
            $ref: '#/definitions/recovery.ErrorResponse'
        "401":
          description: Identitas client tidak valid
          schema:
            $ref: '#/definitions/recovery.ErrorResponse'
        "409":
          description: Konflik atau state tidak valid
          schema:
            $ref: '#/definitions/recovery.ErrorResponse'
        "500":
          description: Gagal membuat recovery request
          schema:
            $ref: '#/definitions/recovery.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create recovery request
      tags:
      - Recovery
  /recovery/requests/{id}/execute:
    post:
      description: Mengeksekusi intent recovery ke row client existing melalui Agent;
        tidak membuat tabel baru.
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Eksekusi recovery dimulai/berhasil
          schema:
            $ref: '#/definitions/recovery.RequestDetailResponse'
        "401":
          description: Identitas client tidak valid
          schema:
            $ref: '#/definitions/recovery.ErrorResponse'
        "404":
          description: Request tidak ditemukan
          schema:
            $ref: '#/definitions/recovery.ErrorResponse'
        "409":
          description: State request tidak sesuai
          schema:
            $ref: '#/definitions/recovery.ErrorResponse'
        "500":
          description: Gagal mengeksekusi recovery
          schema:
            $ref: '#/definitions/recovery.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Execute recovery request
      tags:
      - Recovery
  /recovery/resources/{resource}/versions:
    get:
      description: Mengambil histori event client ter-anchor dari sebuah resource
        (table).
      parameters:
      - description: Resource/Table Name
        in: path
        name: resource
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Histori event client ter-anchor
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Identitas client tidak valid
          schema:
            $ref: '#/definitions/recovery.ErrorResponse'
        "500":
          description: Gagal mengambil histori recovery
          schema:
            $ref: '#/definitions/recovery.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List snapshot versions by resource
      tags:
      - Recovery
  /report/generate:
    post:
      consumes:
      - application/json
      description: Men-generate laporan audit PDF atau CSV berdasarkan periode waktu
        tertentu.
      parameters:
      - description: Parameter laporan
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/report.GenerateReportRequest'
      produces:
      - application/pdf
      - text/csv
      responses:
        "200":
          description: File laporan PDF atau CSV
          schema:
            type: file
        "400":
          description: Format request tidak valid
          schema:
            $ref: '#/definitions/report.ErrorResponse'
        "401":
          description: Identitas client tidak valid
          schema:
            $ref: '#/definitions/report.ErrorResponse'
        "500":
          description: Gagal generate laporan
          schema:
            $ref: '#/definitions/report.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Generate audit report
      tags:
      - Report
securityDefinitions:
  BearerAuth:
    description: 'Masukkan token dengan format: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
