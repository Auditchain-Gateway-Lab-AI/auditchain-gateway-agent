services:
  gateway-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    image: auditchain-gateway-runtime:local
    container_name: auditchain-gateway-runtime
    user: "${GATEWAY_UID:-1000}:${GATEWAY_GID:-1000}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8080}
      FABRIC_TLS_CERT_PATH: /run/secrets/fabric/ca.crt
      FABRIC_CERT_PATH: /run/secrets/fabric/probe-cert.pem
      FABRIC_KEY_PATH: /run/secrets/fabric/probe-key.pem
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:${PORT:-8080}"
    volumes:
      - "${FABRIC_MATERIAL_DIR:-/home/morbis1/.config/auditchain/fabric}:/run/secrets/fabric:ro"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -r /run/secrets/fabric/ca.crt
          && test -r /run/secrets/fabric/probe-cert.pem
          && test -r /run/secrets/fabric/probe-key.pem
          && wget -qO- "http://127.0.0.1:${PORT:-8080}/readyz" >/dev/null
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
