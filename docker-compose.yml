services:
  auditchain-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: auditchain-agent:latest
    container_name: auditchain-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Bisa juga di-override langsung di sini, tapi lebih rapi lewat .env
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      AGENT_VERIFY_TOKEN: ${AGENT_VERIFY_TOKEN}
      AGENT_VERIFY_PORT: ${AGENT_VERIFY_PORT:-9090}
      AGENT_AUDIT_TRAIL_SCHEMA: ${AGENT_AUDIT_TRAIL_SCHEMA:-}
      AGENT_AUDIT_TRAIL_TABLE: ${AGENT_AUDIT_TRAIL_TABLE:-AUDIT_TRAIL}
      AGENT_ENABLE_TABLE_ENDPOINT: ${AGENT_ENABLE_TABLE_ENDPOINT:-false}
      AGENT_RECOVERY_ENABLED: ${AGENT_RECOVERY_ENABLED:-false}
      AGENT_CLIENT_ID: ${AGENT_CLIENT_ID:-}
      AGENT_RECOVERY_TOKEN: ${AGENT_RECOVERY_TOKEN:-}
      AGENT_RECOVERY_STATE_PATH: ${AGENT_RECOVERY_STATE_PATH:-/var/lib/auditchain-agent/recovery-state.db}
      AGENT_RECOVERY_MAX_BODY_BYTES: ${AGENT_RECOVERY_MAX_BODY_BYTES:-1048576}
      AGENT_RECOVERY_MAX_COLUMNS: ${AGENT_RECOVERY_MAX_COLUMNS:-64}
      AGENT_RECOVERY_MAX_CLOCK_SKEW_SECONDS: ${AGENT_RECOVERY_MAX_CLOCK_SKEW_SECONDS:-300}
      AGENT_RECOVERY_REQUEST_TIMEOUT_SECONDS: ${AGENT_RECOVERY_REQUEST_TIMEOUT_SECONDS:-15}
      AGENT_RECOVERY_RETENTION_DAYS: ${AGENT_RECOVERY_RETENTION_DAYS:-90}
      AGENT_RECOVERY_POLICY_PATH: ${AGENT_RECOVERY_POLICY_PATH:-/app/recovery-policy.yml}
    ports:
      - "${AGENT_VERIFY_PORT:-9090}:${AGENT_VERIFY_PORT:-9090}"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./recovery-policy.yml:/app/recovery-policy.yml:ro
      - auditchain-agent-recovery-state:/var/lib/auditchain-agent
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  auditchain-agent-recovery-state:
